<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 Game</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Arial', sans-serif;
  background: #faf8ef;
  color: #776e65;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

.container {
  max-width: 500px;
  margin: 0 auto;
  padding: 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  flex-shrink: 0;
}

h1 {
  font-size: 40px;
  color: #776e65;
}

.score-box {
  display: flex;
  gap: 6px;
}

.info-box {
  background: #bbada0;
  color: #f9f6f2;
  padding: 4px 12px;
  border-radius: 6px;
  text-align: center;
  min-width: 60px;
}

.info-box .label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.info-box .value {
  font-size: 18px;
  font-weight: bold;
}

.btn {
  background: #8f7a66;
  color: #f9f6f2;
  border: none;
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 15px;
  cursor: pointer;
  flex-shrink: 0;
  touch-action: manipulation;
  margin-bottom: 8px;
}
.btn:hover { background: #9f8a76; }

.board-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
}

.controls {
  font-size: 13px;
  color: #776e65;
  margin-top: 8px;
  flex-shrink: 0;
}

#game-board {
  background: #bbada0;
  border-radius: 6px;
  padding: 8px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 8px;
  width: 90%;
  max-width: 500px;
  aspect-ratio: 1;
  touch-action: none;
  overflow: hidden;
  flex-shrink: 0;
}

.cell {
  background: rgba(238, 228, 218, 0.35);
  border-radius: 3px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.tile {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  border-radius: 3px;
  animation: appear 0.15s ease;
  font-size: clamp(24px, 7vmin, 36px);
}

@keyframes appear {
  0% { opacity: 0; transform: scale(0.5); }
  100% { opacity: 1; transform: scale(1); }
}

.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
}
.overlay.hidden { display: none; }

.overlay-content {
  background: #faf8ef;
  border-radius: 12px;
  padding: 32px;
  text-align: center;
}
.overlay-content h2 { font-size: 36px; margin-bottom: 12px; }
.overlay-content p { font-size: 18px; margin-bottom: 20px; }

footer {
  font-size: 11px;
  color: #776e65;
  opacity: 0.6;
  margin-top: auto;
  padding-top: 10px;
  flex-shrink: 0;
}

/* Tile colors */
.tile-2    { background: #eee4da; color: #776e65; }
.tile-4    { background: #ede0c8; color: #776e65; }
.tile-8    { background: #f2b179; color: #f9f6f2; }
.tile-16   { background: #f59563; color: #f9f6f2; }
.tile-32   { background: #f67c5f; color: #f9f6f2; }
.tile-64   { background: #f65e3b; color: #f9f6f2; }
.tile-128  { background: #edcf72; color: #f9f6f2; }
.tile-256  { background: #edcc61; color: #f9f6f2; }
.tile-512  { background: #edc850; color: #f9f6f2; }
.tile-1024 { background: #edc53f; color: #f9f6f2; }
.tile-2048 { background: #edc22e; color: #f9f6f2; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>2048</h1>
    <div class="score-box">
      <div class="info-box">
        <span class="label">Score</span>
        <span class="value" id="score">0</span>
      </div>
      <div class="info-box">
        <span class="label">Best</span>
        <span class="value" id="best-score">0</span>
      </div>
    </div>
  </header>

  <button id="new-game" class="btn">New Game</button>

  <div class="board-wrapper">
    <div id="game-board"></div>
    <p class="controls">Arrow keys or swipe to move</p>
  </div>

  <footer>Version: <span id="git-hash">19724984</span></footer>
</div>

<div id="game-over-overlay" class="overlay hidden">
  <div class="overlay-content">
    <h2>Game Over!</h2>
    <p>Score: <span id="final-score">0</span></p>
    <button id="try-again" class="btn">Try Again</button>
  </div>
</div>

<script>
(function() {
  'use strict';
  const SIZE = 4;
  let board, score, bestScore, gameOver, won;

  const boardEl = document.getElementById('game-board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best-score');
  const finalScoreEl = document.getElementById('final-score');
  const overlay = document.getElementById('game-over-overlay');

  let touchStartX = 0, touchStartY = 0;

  // CSS aspect-ratio handles square board; this is a safety net
  function ensureSquare() {
    const w = boardEl.offsetWidth;
    if (w > 0 && Math.abs(boardEl.offsetHeight - w) > 2) {
      boardEl.style.height = w + 'px';
    }
  }

  function init() {
    startNewGame();
    document.getElementById('new-game').addEventListener('click', startNewGame);
    document.getElementById('try-again').addEventListener('click', startNewGame);
    document.addEventListener('keydown', onKey);
    boardEl.addEventListener('touchstart', onTouchStart, { passive: true });
    boardEl.addEventListener('touchend', onTouchEnd, { passive: true });
    window.addEventListener('resize', ensureSquare);
    // Fallback: re-check squareness after render settles
    setTimeout(ensureSquare, 50);
    setTimeout(ensureSquare, 200);
    setTimeout(ensureSquare, 500);
  }

  function startNewGame() {
    board = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    gameOver = false;
    won = false;
    addRandomTile();
    addRandomTile();
    updateScore();
    render();
    overlay.classList.add('hidden');
  }

  function addRandomTile() {
    const empty = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 0) empty.push([r, c]);
    if (empty.length === 0) return;
    const [r, c] = empty[Math.floor(Math.random() * empty.length)];
    board[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (board[r][c] !== 0) {
          const tile = document.createElement('div');
          const val = board[r][c];
          tile.className = 'tile tile-' + val;
          tile.textContent = val;
          cell.appendChild(tile);
        }
        boardEl.appendChild(cell);
      }
    }
    // Ensure square after reflow
    requestAnimationFrame(ensureSquare);
    setTimeout(ensureSquare, 100);
  }

  function onKey(e) {
    if (gameOver || won) return;
    const map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    const dir = map[e.key];
    if (dir) { e.preventDefault(); move(dir); }
  }

  function onTouchStart(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }

  function onTouchEnd(e) {
    if (gameOver || won) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 30 && Math.abs(dy) < 30) return;
    let dir;
    if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
    else dir = dy > 0 ? 'down' : 'up';
    move(dir);
  }

  function slide(row) {
    let arr = row.filter(v => v !== 0);
    for (let i = 0; i < arr.length - 1; i++) {
      if (arr[i] === arr[i + 1]) {
        arr[i] *= 2;
        score += arr[i];
        arr.splice(i + 1, 1);
      }
    }
    while (arr.length < SIZE) arr.push(0);
    return arr;
  }

  function move(dir) {
    let moved = false;
    const oldBoard = board.map(r => r.join(','));

    for (let i = 0; i < SIZE; i++) {
      if (dir === 'left') {
        board[i] = slide(board[i]);
      } else if (dir === 'right') {
        board[i] = slide([...board[i]].reverse()).reverse();
      } else if (dir === 'up') {
        const col = board.map(r => r[i]);
        const after = slide(col);
        for (let r = 0; r < SIZE; r++) board[r][i] = after[r];
      } else if (dir === 'down') {
        const col = board.map(r => r[i]).reverse();
        const after = slide(col);
        const unrev = after.reverse();
        for (let r = 0; r < SIZE; r++) board[r][i] = unrev[r];
      }
    }

    for (let i = 0; i < SIZE; i++) {
      if (board[i].join(',') !== oldBoard[i]) { moved = true; break; }
    }

    if (!moved) return;

    addRandomTile();
    render();
    updateScore();

    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (board[r][c] === 2048) { won = true; setTimeout(() => alert('\uD83C\uDF89 You win!'), 100); return; }

    if (isGameOver()) {
      gameOver = true;
      finalScoreEl.textContent = score;
      overlay.classList.remove('hidden');
    }
  }

  function isGameOver() {
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        if (board[r][c] === 0) return false;
        if (c < SIZE - 1 && board[r][c] === board[r][c + 1]) return false;
        if (r < SIZE - 1 && board[r][c] === board[r + 1][c]) return false;
      }
    return true;
  }

  function updateScore() {
    scoreEl.textContent = score;
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem('best-2048', bestScore);
      bestEl.textContent = bestScore;
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    bestScore = parseInt(localStorage.getItem('best-2048') || '0', 10);
    bestEl.textContent = bestScore;
    init();
  });
})();
</script>
</body>
</html>
